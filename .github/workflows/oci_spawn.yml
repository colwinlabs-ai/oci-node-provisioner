name: Continuous OCI Python SDK Provisioner Loop
on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes automatically
  workflow_dispatch:       # Allows manual execution triggers

# CRITICAL: without this, a run that takes longer than 5 minutes overlaps
# with the next scheduled trigger. Multiple concurrent runs hammer the OCI
# API in parallel and, in the rare case two succeed near-simultaneously,
# can launch more than one A1.Flex instance and blow past the Always Free
# quota. `cancel-in-progress: false` means new triggers QUEUE instead of
# running in parallel — at most one bot.py process runs at a time.
concurrency:
  group: oci-provisioner
  cancel-in-progress: false

permissions:
  contents: read   # this workflow only reads the repo; no write access needed

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # safety net in case the OCI SDK ever hangs
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK Requirements
        run: pip install -r requirements.txt

      - name: Execute Python Provisioning Engine
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          # ADD THIS RUNNER MAPPING LINE RIGHT HERE:
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }} 
        run: python "Ampere 24 ram 4 cpu/bot.py"
